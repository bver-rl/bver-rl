# Experiment: Maze Scatter, bidirectional / forward-only / backward-only BVER vs PPO baseline and random control.
# Arms differ only in how each reset picks start and goal; the random control samples the wall-filtered maze.
# Layout: scatter_maze, scattered blocks with many routes, 10 s shortest path; episode 15.0 s.

experiment:
  name: "maze_scatter_v1"
  description: "point-mass Scatter maze, BVER vs baseline vs random"
  hypothesis: ""
  author: ""
  date: ""
  wandb:
    project: "isaaclab_maze"
    group: "maze_scatter_v1"
    tags: ["maze", "scatter", "bver"]

defaults:
  headless: true
  num_envs: 4096
  seeds: [572857, 525934, 239914, 8127456, 1917461]
  max_iterations: 600
  logger: wandb

runs:
  - task: "Maze-Scatter-BVER-v0"
    run_name: "scatter_bver_bidir_g0"
    tags: ["bver", "bidir"]
    sweep:
      env.scene.num_envs:
        values: [4096]
      env.curriculum.initialization.goal_connect_ratio:
        values: [0.0]
      env.curriculum.initialization.start_connect_ratio:
        values: [0.0]

  - task: "Maze-Scatter-BVER-fwd-v0"
    run_name: "scatter_bver_fwd"
    tags: ["bver", "fwd"]
    sweep:
      env.scene.num_envs:
        values: [4096]

  - task: "Maze-Scatter-BVER-bwd-v0"
    run_name: "scatter_bver_bwd"
    tags: ["bver", "bwd"]
    sweep:
      env.scene.num_envs:
        values: [4096]

  - task: "Maze-Scatter-Baseline-v0"
    run_name: "scatter_baseline"
    tags: ["baseline"]
    sweep:
      env.scene.num_envs:
        values: [4096]

  - task: "Maze-Scatter-Random-v0"
    run_name: "scatter_random"
    tags: ["random"]
    sweep:
      env.scene.num_envs:
        values: [4096]
