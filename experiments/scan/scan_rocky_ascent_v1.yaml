# Experiment: scan rocky_ascent, a rocky slope with no summit and a goal up the ascent. Used at its measured size.
# BVER bidir/fwd/bwd, PPO baseline and matched RandomGS controls on a fenced scan raster with xyz/yaw obs.
# Purely sparse climb-campaign MDP (no `progress` term); start and goal poses are PROVISIONAL.

experiment:
  name: "scan_rocky_ascent_v1"
  description: "BVER ablation on the rocky_ascent scan"
  hypothesis: ""
  author: ""
  date: ""
  wandb:
    project: "isaaclab_parkour_scan_rocky_ascent"
    group: "scan_rocky_ascent_v1"
    tags: ["scan_rocky_ascent_v1", "low entropy"]

defaults:
  headless: true
  num_envs: 4096
  seeds: [525934, 239914, 572857]
  max_iterations: 4000
  logger: wandb

runs:

  - task: "Parkour-Scan-RockyAscent-BVER-v0"
    run_name: "bver_bidir"
    tags: ["bver", "bidir"]
    sweep:
      env.scene.num_envs:
          values: [4096]

  - task: "Parkour-Scan-RockyAscent-BVER-fwd-v0"
    run_name: "bver_fw_only"
    tags: ["bver", "fw_only"]
    sweep:
      env.scene.num_envs:
          values: [4096]

  - task: "Parkour-Scan-RockyAscent-BVER-bwd-v0"
    run_name: "bver_bw_only"
    tags: ["bver", "bw_only"]
    sweep:
      env.scene.num_envs:
          values: [4096]

  - task: "Parkour-Scan-RockyAscent-Baseline-v0"
    run_name: "baseline"
    max_iterations: 1000
    tags: ["baseline"]
    sweep:
      env.scene.num_envs:
          values: [4096]

  # Matched uninformed controls; run Parkour-Scan-RockyAscent-GenFeasibleStarts-v0 first.
  - task: "Parkour-Scan-RockyAscent-RandomGS-v0"
    run_name: "random_gs_bidir"
    tags: ["random_gs", "bidir"]
    sweep:
      env.scene.num_envs:
          values: [4096]

  - task: "Parkour-Scan-RockyAscent-RandomGS-fwd-v0"
    run_name: "random_gs_fw_only"
    tags: ["random_gs", "fw_only"]
    sweep:
      env.scene.num_envs:
          values: [4096]

  - task: "Parkour-Scan-RockyAscent-RandomGS-bwd-v0"
    run_name: "random_gs_bw_only"
    tags: ["random_gs", "bw_only"]
    sweep:
      env.scene.num_envs:
          values: [4096]
