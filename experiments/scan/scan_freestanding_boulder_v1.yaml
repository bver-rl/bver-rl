# Experiment: scan freestanding_boulder. A single boulder on level ground, approachable from any side. Enlarged 2x.
# BVER bidir/fwd/bwd, PPO baseline and matched RandomGS controls on a fenced scan raster with xyz/yaw obs.
# Purely sparse climb-campaign MDP (no `progress` term); start and goal poses are PROVISIONAL.

experiment:
  name: "scan_freestanding_boulder_v1"
  description: "BVER ablation on the freestanding_boulder scan"
  hypothesis: ""
  author: ""
  date: ""
  wandb:
    project: "isaaclab_parkour_scan_freestanding_boulder"
    group: "scan_freestanding_boulder_v1"
    tags: ["scan_freestanding_boulder_v1", "low entropy"]

defaults:
  headless: true
  num_envs: 4096
  seeds: [525934, 239914, 572857, 8127456, 1917461]
  max_iterations: 3000
  logger: wandb

runs:

  - task: "Parkour-Scan-FreestandingBoulder-BVER-v0"
    run_name: "bver_bidir"
    tags: ["bver", "bidir"]
    sweep:
      env.scene.num_envs:
          values: [4096]

  - task: "Parkour-Scan-FreestandingBoulder-BVER-fwd-v0"
    run_name: "bver_fw_only"
    tags: ["bver", "fw_only"]
    sweep:
      env.scene.num_envs:
          values: [4096]

  - task: "Parkour-Scan-FreestandingBoulder-BVER-bwd-v0"
    run_name: "bver_bw_only"
    tags: ["bver", "bw_only"]
    sweep:
      env.scene.num_envs:
          values: [4096]

  - task: "Parkour-Scan-FreestandingBoulder-Baseline-v0"
    run_name: "baseline"
    max_iterations: 1000
    tags: ["baseline"]
    sweep:
      env.scene.num_envs:
          values: [4096]

  # Matched uninformed controls; run Parkour-Scan-FreestandingBoulder-GenFeasibleStarts-v0 first.
  - task: "Parkour-Scan-FreestandingBoulder-RandomGS-v0"
    run_name: "random_gs_bidir"
    tags: ["random_gs", "bidir"]
    sweep:
      env.scene.num_envs:
          values: [4096]

  - task: "Parkour-Scan-FreestandingBoulder-RandomGS-fwd-v0"
    run_name: "random_gs_fw_only"
    tags: ["random_gs", "fw_only"]
    sweep:
      env.scene.num_envs:
          values: [4096]

  - task: "Parkour-Scan-FreestandingBoulder-RandomGS-bwd-v0"
    run_name: "random_gs_bw_only"
    tags: ["random_gs", "bw_only"]
    sweep:
      env.scene.num_envs:
          values: [4096]
