# Eval config for Parkour-Scan-BoulderSmallRocks-BVER-EVAL-v0, matching experiments/scan_boulder_small_rocks_v1.yaml.
# Checkpoints live under logs/rsl_rl/anymal_d_scan_boulder_small_rocks; pass that as --checkpoint_base_path.
# `runs:` lists checkpoint FOLDER names, not task ids, one per line (the sweep indexes into it).

num_envs: 256
num_samples: 512
seed: 42
models: [0, 200, 400, 600, 800, 1000, 1200, 1400, 1600, 1800, 1999]

wandb:
  project: "isaaclab_parkour_scan_boulder_small_rocks_eval"
  group: "scan_boulder_small_rocks_v1"  # only used if runs carry no tag
  tags: ["scan_boulder_small_rocks_v1", "bver"]

# Fill in after training.
runs: []
