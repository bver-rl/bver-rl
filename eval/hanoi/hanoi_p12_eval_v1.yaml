# Eval config for Franka-Hanoi-P12-EVAL-v0, matching experiments/hanoi/p12.yaml.
# Checkpoints live under logs/rsl_rl/hanoi; pass that as --checkpoint_base_path.
# `runs:` lists checkpoint FOLDER names, not task ids, one per line (the sweep indexes into it).

num_envs: 512
num_samples: 512
seed: 42
models: [0, 60, 120, 180, 240, 300, 360, 420, 480, 540, 599]

wandb:
  project: "isaaclab_hanoi_eval"
  group: "hanoi_p12_v1"  # only used if runs carry no tag
  tags: ["hanoi_p12_v1", "hanoi", "p12"]

# Fill in after training.
runs: []
